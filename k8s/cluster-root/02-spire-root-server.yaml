apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-root-server
  namespace: spire-root
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-root-server
  namespace: spire-root
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "ndip"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_ttl = "168h"
      default_x509_svid_ttl = "1h"
      ca_key_type = "ec-p384"
      ca_subject = {
        country = ["VN"]
        organization = ["GEIC"]
        common_name = "NDIP SPIRE Root"
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      UpstreamAuthority "vault" {
        plugin_data {
          vault_addr = "http://openbao.openbao.svc.cluster.local:8200"
          pki_mount_point = "pki"
          insecure_skip_verify = true
          k8s_auth {
            k8s_auth_mount_point = "kubernetes"
            k8s_auth_role_name = "spire-root-server"
            token_path = "/var/run/secrets/openbao/token"
          }
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "geic-a" = {
              service_account_allow_list = ["spire-system:spire-nested-server"]
              kube_config_file = "/run/spire/kubeconfig/geic-a.conf"
            }
            "geic-b" = {
              service_account_allow_list = ["spire-system:spire-nested-server"]
              kube_config_file = "/run/spire/kubeconfig/geic-b.conf"
            }
          }
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-root-server
  namespace: spire-root
  labels:
    app: spire-root-server
spec:
  replicas: 1
  serviceName: spire-root-server
  selector:
    matchLabels:
      app: spire-root-server
  template:
    metadata:
      labels:
        app: spire-root-server
    spec:
      serviceAccountName: spire-root-server
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.2
          args:
            - -config
            - /run/spire/config/server.conf
          ports:
            - name: grpc
              containerPort: 8081
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: spire-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: workload-cluster-kubeconfigs
              mountPath: /run/spire/kubeconfig
              readOnly: true
            - name: openbao-auth-token
              mountPath: /var/run/secrets/openbao
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: spire-config
          configMap:
            name: spire-root-server
        - name: workload-cluster-kubeconfigs
          projected:
            sources:
              - secret:
                  name: geic-a-kubeconfig
              - secret:
                  name: geic-b-kubeconfig
        - name: openbao-auth-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: openbao
  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-root-server
  namespace: spire-root
spec:
  type: NodePort
  selector:
    app: spire-root-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-root-default-deny
  namespace: spire-root
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-root-server-allow-workload-clusters
  namespace: spire-root
spec:
  podSelector:
    matchLabels:
      app: spire-root-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.21.0.0/16
      ports:
        - protocol: TCP
          port: 8081
