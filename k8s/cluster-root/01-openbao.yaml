apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: openbao
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-reviewer
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao
  namespace: openbao
data:
  config.hcl: |
    ui = false
    disable_mlock = true

    storage "file" {
      path = "/openbao/data"
    }

    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_disable = true
    }

    api_addr = "http://openbao.openbao.svc.cluster.local:8200"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: openbao
  labels:
    app: openbao
spec:
  replicas: 1
  serviceName: openbao
  selector:
    matchLabels:
      app: openbao
  template:
    metadata:
      labels:
        app: openbao
    spec:
      serviceAccountName: openbao
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openbao
          image: openbao/openbao:2.6.2
          args:
            - server
            - -config=/openbao/config/config.hcl
          env:
            - name: SKIP_SETCAP
              value: "true"
            - name: BAO_ADDR
              value: http://127.0.0.1:8200
          ports:
            - name: api
              containerPort: 8200
          volumeMounts:
            - name: openbao-config
              mountPath: /openbao/config
              readOnly: true
            - name: openbao-data
              mountPath: /openbao/data
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
              port: 8200
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: openbao-config
          configMap:
            name: openbao
  volumeClaimTemplates:
    - metadata:
        name: openbao-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: openbao
spec:
  selector:
    app: openbao
  ports:
    - name: api
      port: 8200
      targetPort: 8200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-default-deny
  namespace: openbao
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-spire-root-server
  namespace: openbao
spec:
  podSelector:
    matchLabels:
      app: openbao
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spire-root
          podSelector:
            matchLabels:
              app: spire-root-server
      ports:
        - protocol: TCP
          port: 8200
