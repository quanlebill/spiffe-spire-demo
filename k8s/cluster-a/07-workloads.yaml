apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-a
  namespace: workloads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-a
  namespace: workloads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: workloads
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: frontend-a
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: frontend-workload:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: frontend
            - name: CLUSTER_NAME
              value: geic-a
            - name: SPIFFE_ID
              value: spiffe://ndip/ns/workloads/sa/frontend-a
            - name: LISTEN_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LISTEN_PORT
              value: "8080"
            - name: BACKEND_HOST
              value: backend
            - name: BACKEND_PORT
              value: "8080"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["python", "-c", "import os, socket; socket.create_connection((os.environ['LISTEN_HOST'], 8080), 2).close()"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: workloads
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        inject.istio.io/templates: "sidecar,spire"
    spec:
      serviceAccountName: backend-a
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: backend-workload:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_NAME
              value: backend
            - name: CLUSTER_NAME
              value: geic-a
            - name: SPIFFE_ID
              value: spiffe://ndip/ns/workloads/sa/backend-a
            - name: LISTEN_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: LISTEN_PORT
              value: "8080"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["python", "-c", "import os, socket; socket.create_connection((os.environ['LISTEN_HOST'], 8080), 2).close()"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: workloads
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: workloads
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backend-geic-b
  namespace: workloads
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 30080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: backend-geic-b
  namespace: workloads
spec:
  host: backend-geic-b.workloads.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
      subjectAltNames:
        - spiffe://ndip/ns/workloads/sa/backend-b
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: default
  namespace: workloads
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: backend-allow-frontend
  namespace: workloads
spec:
  selector:
    matchLabels:
      app: backend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - ndip/ns/workloads/sa/frontend-a
      to:
        - operation:
            methods: ["POST"]
            paths: ["/receive-message"]
    - from:
        - source:
            principals:
              - ndip/ns/workloads/sa/frontend-a
      to:
        - operation:
            methods: ["GET"]
            paths: ["/whoami", "/messages"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: frontend-allow-backend
  namespace: workloads
spec:
  selector:
    matchLabels:
      app: frontend
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - ndip/ns/workloads/sa/backend-a
      to:
        - operation:
            methods: ["POST"]
            paths: ["/receive-reply"]
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: frontend
  namespace: workloads
spec:
  workloadSelector:
    labels:
      app: frontend
  egress:
    - hosts:
        - workloads/backend.workloads.svc.cluster.local
        - workloads/backend-geic-b.workloads.svc.cluster.local
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: backend
  namespace: workloads
spec:
  workloadSelector:
    labels:
      app: backend
  egress:
    - hosts:
        - istio-system/*
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: workloads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: workloads
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istiod-egress
  namespace: workloads
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-system
      ports:
        - protocol: TCP
          port: 15012
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-node-probes-ingress
  namespace: workloads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 172.21.0.0/16
      ports:
        - protocol: TCP
          port: 15020
        - protocol: TCP
          port: 15021
        - protocol: TCP
          port: 15090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress-to-backend
  namespace: workloads
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - ipBlock:
            cidr: 172.21.0.0/16
      ports:
        - protocol: TCP
          port: 30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-ingress-from-frontend
  namespace: workloads
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 8080
