apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-workload
  namespace: workloads
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend-workload
  namespace: workloads
  labels:
    app: frontend-workload
spec:
  serviceAccountName: frontend-workload
  securityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: fetch-svid
      image: ghcr.io/spiffe/spire-agent:1.15.2
      command:
        - /opt/spire/bin/spire-agent
        - api
        - fetch
        - x509
        - -socketPath
        - /run/spire/sockets/agent.sock
        - -write
        - /run/spire/svids
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        - name: svid-files
          mountPath: /run/spire/svids
  containers:
    - name: frontend-workload
      image: frontend-workload:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 8443
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: svid-files
          mountPath: /run/spire/svids
          readOnly: true
  volumes:
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/sockets
        type: Directory
    - name: svid-files
      emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-workload-service
  namespace: workloads
spec:
  selector:
    app: frontend-workload
  ports:
    - port: 8443
      targetPort: 8443
