apiVersion: v1
kind: ServiceAccount
metadata:
  name: forged-cert-test
  namespace: workloads
---
apiVersion: v1
kind: Pod
metadata:
  name: forged-cert-test
  namespace: workloads
  labels:
    app: forged-cert-test
spec:
  serviceAccountName: forged-cert-test
  restartPolicy: Never
  securityContext:
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  initContainers:
    - name: fetch-svid
      image: ghcr.io/spiffe/spire-agent:1.15.2
      command:
        - /opt/spire/bin/spire-agent
        - api
        - fetch
        - x509
        - -socketPath
        - /run/spire/sockets/agent.sock
        - -write
        - /run/spire/svids
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: spire-agent-socket
          mountPath: /run/spire/sockets
          readOnly: true
        - name: svid-files
          mountPath: /run/spire/svids
  containers:
    - name: forged-cert-test
      image: frontend-workload:latest
      imagePullPolicy: IfNotPresent
      command:
        - python
        - -c
        - |
          import datetime
          import subprocess
          from pathlib import Path

          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.x509.oid import NameOID

          private_key = ec.generate_private_key(ec.SECP384R1())
          subject = issuer = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, "forged")])
          certificate = (
              x509.CertificateBuilder()
              .subject_name(subject)
              .issuer_name(issuer)
              .public_key(private_key.public_key())
              .serial_number(x509.random_serial_number())
              .not_valid_before(datetime.datetime.utcnow())
              .not_valid_after(datetime.datetime.utcnow() + datetime.timedelta(hours=1))
              .add_extension(x509.SubjectAlternativeName([x509.UniformResourceIdentifier("spiffe://ndip/frontend")]), critical=False)
              .sign(private_key, hashes.SHA384())
          )
          Path("/tmp/forged-cert.pem").write_bytes(certificate.public_bytes(serialization.Encoding.PEM))
          Path("/tmp/forged-key.pem").write_bytes(private_key.private_bytes(serialization.Encoding.PEM, serialization.PrivateFormat.PKCS8, serialization.NoEncryption()))

          http_request = (
              b"POST /receive-message HTTP/1.1\r\n"
              b"Host: backend-workload-service\r\n"
              b"Content-Type: application/json\r\n"
              b"Content-Length: 15\r\n"
              b"Connection: close\r\n\r\n"
              b'{"message":"x"}'
          )
          result = subprocess.run(
              [
                  "openssl", "s_client",
                  "-connect", "backend-workload-service:8443",
                  "-cert", "/tmp/forged-cert.pem",
                  "-key", "/tmp/forged-key.pem",
                  "-CAfile", "/run/spire/svids/bundle.0.pem",
                  "-verify_return_error",
                  "-tls1_3",
                  "-ign_eof",
              ],
              input=http_request,
              capture_output=True,
              timeout=15,
          )
          print("=== stdout ===", flush=True)
          print(result.stdout.decode(errors="replace"), flush=True)
          print("=== stderr ===", flush=True)
          print(result.stderr.decode(errors="replace"), flush=True)
          print(f"=== exit code {result.returncode} ===", flush=True)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: svid-files
          mountPath: /run/spire/svids
          readOnly: true
  volumes:
    - name: spire-agent-socket
      hostPath:
        path: /run/spire/sockets
        type: Directory
    - name: svid-files
      emptyDir: {}
