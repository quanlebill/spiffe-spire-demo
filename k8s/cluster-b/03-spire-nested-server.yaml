apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-nested-server
  namespace: spire-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-nested-server
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-nested-server
subjects:
  - kind: ServiceAccount
    name: spire-nested-server
    namespace: spire-system
roleRef:
  kind: ClusterRole
  name: spire-nested-server
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-bundle-publisher
  namespace: spire-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["spire-bundle"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spire-bundle-publisher
  namespace: spire-system
subjects:
  - kind: ServiceAccount
    name: spire-nested-server
    namespace: spire-system
roleRef:
  kind: Role
  name: spire-bundle-publisher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-nested-agent
  namespace: spire-system
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire/agent-data"
      log_level = "INFO"
      server_address = "spire-root-server.spire-system.svc.cluster.local"
      server_port = "8081"
      socket_path = "/run/spire/nested-agent/socket"
      trust_bundle_path = "/run/spire/root-bundle/bundle.crt"
      trust_domain = "ndip"
    }

    plugins {
      NodeAttestor "k8s_psat" {
        plugin_data {
          cluster = "geic-b"
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      WorkloadAttestor "unix" {
        plugin_data {}
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "9980"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-nested-server
  namespace: spire-system
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      socket_path = "/tmp/spire-server/private/api.sock"
      trust_domain = "ndip"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      ca_ttl = "24h"
      default_x509_svid_ttl = "1h"
      ca_key_type = "ec-p384"
      ca_subject = {
        country = ["VN"]
        organization = ["GEIC"]
        common_name = "NDIP SPIRE geic-b"
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "postgres"
          connection_string = "dbname=spire user=spire password=${SPIRE_DB_PASSWORD} host=spire-db.spire-system.svc.cluster.local port=5432 sslmode=disable"
        }
      }

      UpstreamAuthority "spire" {
        plugin_data {
          server_address = "spire-root-server.spire-system.svc.cluster.local"
          server_port = "8081"
          workload_api_socket = "/run/spire/nested-agent/socket"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "geic-b" = {
              service_account_allow_list = ["spire-system:spire-agent"]
            }
          }
        }
      }

      KeyManager "memory" {
        plugin_data {}
      }

      Notifier "k8sbundle" {
        plugin_data {
          namespace = "spire-system"
          config_map = "spire-bundle"
          config_map_key = "bundle.crt"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-bundle
  namespace: spire-system
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-nested-server
  namespace: spire-system
  labels:
    app: spire-nested-server
spec:
  replicas: 1
  serviceName: spire-nested-server
  selector:
    matchLabels:
      app: spire-nested-server
  template:
    metadata:
      labels:
        app: spire-nested-server
    spec:
      serviceAccountName: spire-nested-server
      shareProcessNamespace: true
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: spire-nested-server
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: spire-nested-agent
          image: ghcr.io/spiffe/spire-agent:1.15.2
          restartPolicy: Always
          args:
            - -config
            - /run/spire/config/agent.conf
          env:
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nested-agent-config
              mountPath: /run/spire/config
              readOnly: true
            - name: nested-agent-data
              mountPath: /run/spire/agent-data
            - name: nested-agent-socket
              mountPath: /run/spire/nested-agent
            - name: spire-root-bundle
              mountPath: /run/spire/root-bundle
              readOnly: true
            - name: spire-agent-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /ready
              port: 9980
            periodSeconds: 3
            failureThreshold: 100
          livenessProbe:
            httpGet:
              path: /live
              port: 9980
            initialDelaySeconds: 30
            periodSeconds: 30
      containers:
        - name: spire-server
          image: ghcr.io/spiffe/spire-server:1.15.2
          args:
            - -config
            - /run/spire/config/server.conf
            - -expandEnv
          env:
            - name: SPIRE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spire-db
                  key: password
          ports:
            - name: grpc
              containerPort: 8081
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nested-server-config
              mountPath: /run/spire/config
              readOnly: true
            - name: spire-data
              mountPath: /run/spire/data
            - name: nested-agent-socket
              mountPath: /run/spire/nested-agent
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: nested-agent-config
          configMap:
            name: spire-nested-agent
        - name: nested-server-config
          configMap:
            name: spire-nested-server
        - name: spire-root-bundle
          configMap:
            name: spire-root-bundle
        - name: nested-agent-data
          emptyDir:
            medium: Memory
        - name: nested-agent-socket
          emptyDir: {}
        - name: spire-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: spire-agent
                  expirationSeconds: 7200
                  audience: spire-server
  volumeClaimTemplates:
    - metadata:
        name: spire-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spire-nested-server
  namespace: spire-system
spec:
  selector:
    app: spire-nested-server
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
